name: Release

# Publishing a version: push a tag like v1.0.1. GitHub then builds the DMGs
# (Apple Silicon and Intel) and the small code-only update file, and attaches them to a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm install
      - run: npx electron-builder --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.os }}
          path: dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - name: Build code-only update file
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHELL_V=$(node -p "require('./package.json').clipdeskUpdate.shell")
          node -e "require('fs').writeFileSync('update-manifest.json', JSON.stringify({version: process.argv[1], minShell: Number(process.argv[2])}))" "$VERSION" "$SHELL_V"
          tar -czf clipdesk-code.tar.gz main.js preload.js renderer update-manifest.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dmgs/*.dmg clipdesk-code.tar.gz --title "ClipDesk $GITHUB_REF_NAME" --generate-notes
